<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <a class="logo" href="#">northstar</a>
        <div class="header-actions">
          <input id="import-file" class="sr-only" type="file" accept=".csv,text/csv" />
          <button class="secondary-button" type="button" data-action="export-csv">Export CSV</button>
          <button class="secondary-button" type="button" data-action="import-csv">Import CSV</button>
          <button class="add-button" type="button" data-action="open-modal">+ Add transaction</button>
        </div>
      </header>

      <section class="intro">
        <p class="label"></p>
        <h1>Your money at a glance.</h1>
      </section>

      <section class="balance">
        <p class="label">Current balance</p>
        <strong id="current-balance">£0.00</strong>
        <p class="change" id="balance-change">Add funds below to increase your balance.</p>
        <form class="balance-form" id="balance-form">
          <label for="balance-input">Add to balance</label>
          <div class="balance-input-row">
            <input id="balance-input" required type="number" min="0" step="0.01" placeholder="0.00" />
            <button type="submit">Add</button>
          </div>
        </form>
      </section>

      <section class="numbers">
        <div>
          <p class="label">Income this month</p>
          <strong id="income-total">£0.00</strong>
        </div>
        <div>
          <p class="label">Spent this month</p>
          <strong id="spent-total">£0.00</strong>
        </div>
      </section>

      <section class="spending">
        <div class="section-heading">
          <div>
            <p class="label">This month</p>
            <h2>Spending</h2>
          </div>
          <strong id="monthly-spending-total">£0.00</strong>
        </div>
        <div class="spending-bar" aria-label="Spending breakdown"></div>
        <div class="legend"></div>
        <div class="monthly-spending-list" id="monthly-spending-list"></div>
      </section>

      <section class="transactions">
        <div class="section-heading">
          <div>
            <p class="label">Recent</p>
            <h2>Transactions</h2>
          </div>
        </div>
        <div class="transaction-controls">
          <label>
            <span class="sr-only">Filter transactions by type</span>
            <select id="type-filter">
              <option value="all">All types</option>
            </select>
          </label>
          <label>
            <span class="sr-only">Sort transactions</span>
            <select id="transaction-sort">
              <option value="recent">Most recent</option>
              <option value="type">Type A–Z</option>
              <option value="amount-high">Amount: high to low</option>
              <option value="amount-low">Amount: low to high</option>
            </select>
          </label>
        </div>
        <div id="transaction-list">
        </div>
      </section>

      <p class="footer-note"></p>
    </main>

    <div class="modal-backdrop" id="modal" aria-hidden="true">
      <form class="modal" id="transaction-form">
        <button class="close" type="button" aria-label="Close" data-action="close-modal">×</button>
        <p class="label">Quick entry</p>
        <h2 id="modal-title">Add a transaction</h2>
        <label>Description<input id="description" required /></label>
        <label>Amount<input id="amount" required type="number" min="0.01" step="0.01" /></label>
        <label>Type
          <select id="type" required>
            <option value="Rent">Rent</option>
            <option value="Shopping">Shopping</option>
            <option value="Subscription">Subscription</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <button class="add-button" id="modal-submit" type="submit">Save transaction</button>
      </form>
    </div>
    <div class="modal-backdrop" id="delete-modal" aria-hidden="true">
      <div class="modal confirmation-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title">
        <button class="close" type="button" aria-label="Close" data-action="close-delete-modal">×</button>
        <p class="label">Confirm deletion</p>
        <h2 id="delete-title">Delete transaction?</h2>
        <p class="confirmation-message" id="delete-message"></p>
        <div class="confirmation-actions">
          <button class="secondary-button" type="button" data-action="close-delete-modal">Cancel</button>
          <button class="delete-button" type="button" data-action="confirm-delete">Delete transaction</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
